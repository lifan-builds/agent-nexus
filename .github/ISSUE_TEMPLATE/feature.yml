name: Feature request
description: Propose a target, workflow, or safety improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user journey is difficult or unsafe today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed workflow
      description: Describe preview, confirmation, ownership, and rollback behavior.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [CLI, Dashboard, Target adapter, Package format, Documentation]
