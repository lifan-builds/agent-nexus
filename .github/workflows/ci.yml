name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      # Major tags are used until the project records reviewed immutable SHAs.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider
      - run: python -m py_compile nexus.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: |
          python -m venv /tmp/nexus-wheel
          /tmp/nexus-wheel/bin/pip install dist/*.whl
          /tmp/nexus-wheel/bin/nexus --version
          tmp=$(mktemp -d)
          HOME="$tmp/home" CODEX_HOME="$tmp/codex" /tmp/nexus-wheel/bin/nexus --project-dir "$tmp/work" audit --json --redact-home

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - run: |
          if [ -f tests/test_dashboard_browser.py ]; then
            python -m pytest -q -p no:cacheprovider tests/test_dashboard_browser.py
          else
            echo 'Browser test module not present.'
          fi
