<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent Nexus review-first deployment flow</title>
  <desc id="desc">A five step flow from manifest to dry-run review, native target sync, doctor verification, and lockfile traceability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.52" stop-color="#0d1824"/>
      <stop offset="1" stop-color="#0a1320"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#31d0aa"/>
      <stop offset="1" stop-color="#65a7ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <circle cx="110" cy="16" r="180" fill="#31d0aa" opacity="0.14"/>
  <circle cx="1040" cy="52" r="210" fill="#65a7ff" opacity="0.13"/>
  <path d="M82 180H1118" stroke="#234057" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M82 180H1118" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="156 58" opacity="0.9"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" filter="url(#softShadow)">
    <g transform="translate(52 86)">
      <rect width="190" height="188" rx="24" fill="#0d1824" stroke="#2a4258"/>
      <circle cx="42" cy="42" r="18" fill="#31d0aa"/>
      <text x="70" y="48" fill="#31d0aa" font-size="13" font-weight="800" letter-spacing="1.8">01</text>
      <text x="24" y="96" fill="#eef7ff" font-size="24" font-weight="850">Manifest</text>
      <text x="24" y="126" fill="#9fb3c5" font-size="14">Declare packages,</text>
      <text x="24" y="148" fill="#9fb3c5" font-size="14">MCPs, hooks,</text>
      <text x="24" y="170" fill="#9fb3c5" font-size="14">and targets once.</text>
    </g>
    <g transform="translate(277 86)">
      <rect width="190" height="188" rx="24" fill="#0d1824" stroke="#2a4258"/>
      <circle cx="42" cy="42" r="18" fill="#31d0aa"/>
      <text x="70" y="48" fill="#31d0aa" font-size="13" font-weight="800" letter-spacing="1.8">02</text>
      <text x="24" y="96" fill="#eef7ff" font-size="24" font-weight="850">Dry run</text>
      <text x="24" y="126" fill="#9fb3c5" font-size="14">Review executable</text>
      <text x="24" y="148" fill="#9fb3c5" font-size="14">MCP and hook</text>
      <text x="24" y="170" fill="#9fb3c5" font-size="14">changes first.</text>
    </g>
    <g transform="translate(502 86)">
      <rect width="190" height="188" rx="24" fill="#0d1824" stroke="#2a4258"/>
      <circle cx="42" cy="42" r="18" fill="#65a7ff"/>
      <text x="70" y="48" fill="#65a7ff" font-size="13" font-weight="800" letter-spacing="1.8">03</text>
      <text x="24" y="96" fill="#eef7ff" font-size="24" font-weight="850">Sync</text>
      <text x="24" y="126" fill="#9fb3c5" font-size="14">Write native files</text>
      <text x="24" y="148" fill="#9fb3c5" font-size="14">for Claude, Cursor,</text>
      <text x="24" y="170" fill="#9fb3c5" font-size="14">Codex, and more.</text>
    </g>
    <g transform="translate(727 86)">
      <rect width="190" height="188" rx="24" fill="#0d1824" stroke="#2a4258"/>
      <circle cx="42" cy="42" r="18" fill="#65a7ff"/>
      <text x="70" y="48" fill="#65a7ff" font-size="13" font-weight="800" letter-spacing="1.8">04</text>
      <text x="24" y="96" fill="#eef7ff" font-size="24" font-weight="850">Doctor</text>
      <text x="24" y="126" fill="#9fb3c5" font-size="14">Verify links, MCP</text>
      <text x="24" y="148" fill="#9fb3c5" font-size="14">config, hooks, and</text>
      <text x="24" y="170" fill="#9fb3c5" font-size="14">target health.</text>
    </g>
    <g transform="translate(952 86)">
      <rect width="190" height="188" rx="24" fill="#0d1824" stroke="#2a4258"/>
      <circle cx="42" cy="42" r="18" fill="#ffd166"/>
      <text x="70" y="48" fill="#ffd166" font-size="13" font-weight="800" letter-spacing="1.8">05</text>
      <text x="24" y="96" fill="#eef7ff" font-size="24" font-weight="850">Lockfile</text>
      <text x="24" y="126" fill="#9fb3c5" font-size="14">Trace package refs,</text>
      <text x="24" y="148" fill="#9fb3c5" font-size="14">deployed assets,</text>
      <text x="24" y="170" fill="#9fb3c5" font-size="14">and targets.</text>
    </g>
  </g>
</svg>
