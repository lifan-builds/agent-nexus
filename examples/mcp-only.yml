name: mcp-only-agent-stack
version: 1.0.0

targets:
  - claude
  - cursor
  - codex

packages: []

mcps:
  - name: context7
    command: npx
    args: ["-y", "@upstash/context7-mcp@latest"]

  - name: playwright
    command: npx
    args: ["-y", "@playwright/mcp@latest"]

  - name: remote-docs
    transport: sse
    url: https://example.com/mcp

optional_mcps: []
