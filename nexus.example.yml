# nexus.example.yml — Agent environment manifest template
# Defines packages, MCP servers, and target IDEs for cross-platform deployment.
# Run `nexus sync` to fetch, compile, and deploy all assets.
#
# Copy this file to a gitignored personal manifest and customize for your setup:
#   cp nexus.example.yml nexus.personal.yml

name: agent-nexus
version: 1.0.0

# IDEs to deploy skills, hooks, and MCP configs to
targets:
  - claude         # ~/.claude/skills/, ~/.claude.json
  - cursor         # ~/.cursor/skills/, ~/.cursor/mcp.json
  - antigravity    # ~/.gemini/antigravity/skills/, ~/.gemini/antigravity/mcp_config.json
  - codex          # ~/.codex/skills/, ~/.codex/config.toml

# Packages from GitHub (auto-discovered: skills, hooks, commands, agents)
packages:
  - repo: lifan-builds/context-harness
    ref: main
    # Optional: deploy only selected hook assets from a package.
    # Omit hooks to deploy all discovered hook assets for configured targets.
    # Use hooks: false or hooks: [] to disable hooks from this package.
    hooks:
      - codex

  # Optional package example:
  # - repo: obra/superpowers
  #   ref: v5.0.4
  #   # Optional: deploy this package only to selected targets.
  #   targets: [claude, cursor, antigravity]
  #   # Optional: deploy only selected skills from a package.
  #   skills:
  #     - systematic-debugging
  #     - verification-before-completion
  #   # Optional: fetch only selected paths from large repos.
  #   sparse_paths:
  #     - skills/systematic-debugging
  #   # Optional: add target-specific metadata overlays without mutating package cache.
  #   skill_overrides:
  #     systematic-debugging:
  #       targets: [codex]
  #       agents_openai:
  #         interface:
  #           display_name: "Systematic Debugging"
  #           short_description: "Use this debugging workflow when explicitly invoked."
  #         policy:
  #           allow_implicit_invocation: false

# Inline MCP server declarations (no separate repo needed)
mcps:
  - name: sequential-thinking
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]

  - name: playwright
    command: npx
    args: ["-y", "@playwright/mcp@latest"]

  - name: context7
    command: npx
    args: ["-y", "@upstash/context7-mcp@latest"]

# Optional MCPs (prompted interactively, or auto-included with --all)
optional_mcps:
  - name: github-mcp
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
    description: "GitHub API access (requires GITHUB_TOKEN)"
