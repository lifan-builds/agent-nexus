[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-nexus"
dynamic = ["version"]
description = "Review-first package manager for agent workspaces"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Agent Nexus contributors"}]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/lifan-builds/agent-nexus"
Documentation = "https://github.com/lifan-builds/agent-nexus#readme"
Issues = "https://github.com/lifan-builds/agent-nexus/issues"

[project.optional-dependencies]
test = ["pytest>=8", "build>=1.2", "twine>=6", "playwright>=1.52"]

[project.scripts]
nexus = "nexus:main"

[tool.setuptools]
py-modules = ["nexus"]

[tool.setuptools.dynamic]
version = {attr = "nexus.NEXUS_VERSION"}
